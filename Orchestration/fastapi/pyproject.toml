[project]
name = "catalogguard-orchestration"
version = "0.1.0"
description = "CatalogGuard AI validation orchestration service"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.115,<1.0",
    "pydantic-settings>=2.10,<3.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.7,<3.0",
    "pytest>=8.4,<10.0",
    "pytest-cov>=6.2,<8.0",
    "ruff>=0.12,<1.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
